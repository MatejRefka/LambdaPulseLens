name: lambda-pulse-lens-observability

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  loki:
    image: grafana/loki:3.7.2
    restart: unless-stopped
    command:
      - -config.file=/etc/loki/loki.ec2.yaml
    volumes:
      - ../loki/loki.ec2.yaml:/etc/loki/loki.ec2.yaml:ro
      - loki-data:/loki
    networks:
      - observability
    mem_limit: 768m
    cpus: 0.75
    pids_limit: 128
    security_opt:
      - no-new-privileges:true
    logging: *default-logging

  alloy:
    image: grafana/alloy:v1.18.0
    restart: unless-stopped
    depends_on:
      loki:
        condition: service_started
    command:
      - run
      - /etc/alloy/config.alloy
      - --server.http.listen-addr=0.0.0.0:12345
      - --storage.path=/var/lib/alloy/data
    volumes:
      - ../alloy/config.ec2.alloy:/etc/alloy/config.alloy:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - alloy-data:/var/lib/alloy/data
    ports:
      - "127.0.0.1:12345:12345"
    networks:
      - observability
    mem_limit: 256m
    cpus: 0.25
    pids_limit: 128
    security_opt:
      - no-new-privileges:true
    logging: *default-logging

  grafana:
    image: grafana/grafana:13.1.1
    restart: unless-stopped
    depends_on:
      loki:
        condition: service_started
    volumes:
      - grafana-data:/var/lib/grafana
      - ../grafana/provisioning:/etc/grafana/provisioning:ro
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:?Set GRAFANA_ADMIN_USER in .env}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?Set GRAFANA_ADMIN_PASSWORD in .env}
      GF_SECURITY_SECRET_KEY: ${GRAFANA_SECRET_KEY:?Set GRAFANA_SECRET_KEY in .env}
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_AUTH_ANONYMOUS_HIDE_VERSION: "true"
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_USERS_ALLOW_ORG_CREATE: "false"
      GF_SECURITY_DISABLE_GRAVATAR: "true"
      GF_SECURITY_COOKIE_SAMESITE: strict
      GF_SECURITY_CONTENT_SECURITY_POLICY: "true"
      GF_SNAPSHOTS_EXTERNAL_ENABLED: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES: "false"
    networks:
      - observability
    mem_limit: 512m
    cpus: 0.50
    pids_limit: 256
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    logging: *default-logging

networks:
  observability:
    name: lambda-pulse-lens-observability

volumes:
  loki-data:
    name: lambda-pulse-lens-observability-loki-ebs-data
    driver: local
    driver_opts:
      type: ext4
      o: rw,nosuid,nodev,noexec,noatime
      device: ${LOKI_DATA_DEVICE:?Set LOKI_DATA_DEVICE in .env}
  alloy-data:
  grafana-data:
