name: lambda-pulse-lens-observability

services:
  loki:
    image: grafana/loki:3.7.2
    volumes:
      - ../loki/loki.dev.yaml:/etc/loki/loki.dev.yaml:ro ##mount config file into container as read only
      - loki-data:/loki ##mount loki volume into container
    command:
      - -config.file=/etc/loki/loki.dev.yaml ##use this config
    networks:
      - lambda-pulse-lens-observability ##attach to custom Docker network

  alloy:
    image: grafana/alloy:v1.18.0
    depends_on:
      loki:
        condition: service_started
    volumes:
      - ../alloy/config.dev.alloy:/etc/alloy/config.alloy:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro ##mount Docker socket into Alloy container
      - alloy-data:/var/lib/alloy/data ##persist log positions across container restarts
    command:
      - run
      - /etc/alloy/config.alloy ##run config file
      - --server.http.listen-addr=0.0.0.0:12345 ##listen on the entire network within the container
      - --storage.path=/var/lib/alloy/data ##store component positions in the persistent volume
    ports:
      - "127.0.0.1:12345:12345"
    networks:
      - lambda-pulse-lens-observability

  grafana:
    image: grafana/grafana:13.1.1
    volumes:
      - grafana-data:/var/lib/grafana ##holds local internal state
      - ../grafana/provisioning:/etc/grafana/provisioning:ro
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:?Set GRAFANA_ADMIN_USER in .env}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?Set GRAFANA_ADMIN_PASSWORD in .env}
      GF_SECURITY_SECRET_KEY: ${GRAFANA_SECRET_KEY:?Set GRAFANA_SECRET_KEY in .env}
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_AUTH_ANONYMOUS_HIDE_VERSION: "true"
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_USERS_ALLOW_ORG_CREATE: "false"
      GF_SECURITY_DISABLE_GRAVATAR: "true"
      GF_SECURITY_COOKIE_SAMESITE: strict
      GF_SECURITY_CONTENT_SECURITY_POLICY: "true"
      GF_SNAPSHOTS_EXTERNAL_ENABLED: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES: "false"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    depends_on:
      loki:
        condition: service_started
    networks:
      - lambda-pulse-lens-observability

networks:
  lambda-pulse-lens-observability:
    name: lambda-pulse-lens-observability

volumes:
  loki-data:
  alloy-data:
  grafana-data:
