name: lambda-pulse-lens-observability

services:
  loki:
    image: grafana/loki:3.7.2
    container_name: lambda-pulse-lens-loki
    volumes:
      - ../loki/loki.dev.yaml:/etc/loki/loki.dev.yaml:ro ##mount config file into container as read only
      - loki-data:/loki ##mount loki volume into container
    command:
      - -config.file=/etc/loki/loki.dev.yaml ##use this config
    ports:
      - "3100:3100" ##expose container service to host machine
    labels:
      lambdapulselens.logging: "true" ##advertise for alloy to collect
    networks:
      - lambda-pulse-lens-observability ##attach to custom Docker network

  alloy:
    image: grafana/alloy:v1.16.1
    container_name: lambda-pulse-lens-alloy
    depends_on:
      - loki
    volumes:
      - ../alloy/config.dev.alloy:/etc/alloy/config.alloy:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro ##mount Docker socket into Alloy container
    command:
      - run
      - /etc/alloy/config.alloy ##run config file
      - --server.http.listen-addr=0.0.0.0:12345 ##listen on the entire network within the container
    ports:
      - "12345:12345"
    labels:
      lambdapulselens.logging: "true"
    networks:
      - lambda-pulse-lens-observability

  grafana:
    image: grafana/grafana:13.0.1-security-01
    container_name: lambda-pulse-lens-grafana
    volumes:
      - grafana-data:/var/lib/grafana ##holds local internal state
      - ../grafana/provisioning:/etc/grafana/provisioning:ro
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
    labels:
      lambdapulselens.logging: "true"
    depends_on:
      - loki
    networks:
      - lambda-pulse-lens-observability

networks:
  lambda-pulse-lens-observability:
    name: lambda-pulse-lens-observability

volumes:
  loki-data:
  grafana-data:
